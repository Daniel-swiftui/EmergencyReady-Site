<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EmergencyReady</title>

    <style>
        body {

            padding: 0;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            line-height: 1.6;
            color: #515154;
        }

        .links {
            margin-top: 35px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: #007aff;
            font-size: 18px;
            font-weight: 600;
            padding: 16px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .link:last-child {
            border-bottom: none;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #86868b;
        }

</head>

<body>

    <div class="container">

        <div class="card">

            <p>
                EmergencyReady helps families organize important

            </p>

            <div class="links">

                <a class="link" href="privacy.html">

                </a>

                <a class="link" href="support.html">
